name: Lighthouse CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Prepare SPA fallbacks for LHCI
        # LHCI's staticDistDir serves files literally; create index.html copies
        # under each route so Lighthouse can audit them as standalone URLs.
        run: |
          mkdir -p dist/products dist/cosmetic-grade
          cp dist/index.html dist/products/index.html
          cp dist/index.html dist/cosmetic-grade/index.html
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci